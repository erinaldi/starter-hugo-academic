# ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Documentation: https://docs.hugoblox.com/
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  identity:
    name: "Enrico Rinaldi"
    organization: ""
    type: person
    tagline: ""
    description: "Enrico Rinaldi — quantum computing, lattice field theory, and computational physics."
    social:
      twitter: "enricesena"

  theme:
    mode: system
    pack: "default"

  typography:
    pack: "academic"

  layout:
    radius: "md"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false

  footer:
    style: minimal
    language_switcher: false
    text: ""

  copyright:
    notice: "© {year} {name}"
    license:
      type: custom

  seo:
    title: ""
    ai:
      allow:
        - /
      disallow: []
      note: ""
      contact: ""

  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: false
    citations:
      style: apa

  search:
    enable: true
    suggestions: []
    quick_actions: []

  comments:
    enable: false

  repository:
    enable: false

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  security:
    frame_options: sameorigin

  privacy:
    enable: false
